[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurogami"
version = "0.1.0"
description = "Agent orchestration framework: self-prompting planner, tree execution, verification, and backtracking."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "typer",
    "rich",
    "python-dotenv",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
kurogami = "kurogami.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kurogami"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = false

[[tool.mypy.overrides]]
module = "kurogami.contracts.*"
strict = true

[[tool.mypy.overrides]]
module = "kurogami.engine.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
